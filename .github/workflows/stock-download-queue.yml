name: Stock download queue
on:
  pull_request:
    paths:
      - '.github/workflows/stock-download-queue.yml'
      - 'scriptor/stock_downloads.py'
      - 'scriptor/stock_selection.py'
      - 'scriptor/stock_sources.py'
      - 'tests/test_stock_download_queue.py'
      - 'tests/test_stock_sources_ui.py'
      - 'studio-ui-remotion-verify/src/ui/features/montage/*stock*'
      - 'studio-ui-remotion-verify/scripts/verify-stock-sources-ui.mjs'
permissions:
  contents: read
concurrency:
  group: stock-downloads-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scoped-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LOCALAPPDATA: ${{ runner.temp }}/newsflow-stock-production-boundary
      NEWSFLOW_RUN_ELECTRON_E2E: '1'
    steps:
      - uses: actions/checkout@v6
        with: { lfs: true }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: requirements-test.lock }
      - uses: pnpm/action-setup@v4
        with: { version: '11.19.0' }
      - uses: actions/setup-node@v6
        with: { node-version: '24.19.0', cache: 'pnpm', cache-dependency-path: studio-ui-remotion-verify/pnpm-lock.yaml }
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: python -m pip install ruff==0.16.6
      - run: python -m ruff check scriptor/stock_downloads.py scriptor/stock_selection.py scriptor/stock_sources.py tests/test_stock_download_queue.py tests/test_stock_pipeline.py tests/test_stock_render.py tests/test_stock_sources_ui.py
      - run: python -B scripts/secret-scan.py
      - run: git diff --check HEAD^ HEAD
      - name: Isolated transfer, selection, cache, preparation and settings regressions
        run: python -B tests/run_isolated.py tests.test_stock_download_queue tests.test_stock_selection tests.test_stock_sources tests.test_stock_pipeline tests.test_stock_review_regressions tests.test_stock_settings tests.test_montage_queue_lock tests.test_montage_queue.MontageQueueStateTests.test_montage_parallelism_values_are_saved_without_hidden_upper_limits -q
      - run: pnpm install --frozen-lockfile
        working-directory: studio-ui-remotion-verify
      - run: node node_modules/electron/install.js
        working-directory: studio-ui-remotion-verify
      - name: Scoped React tests and typecheck
        working-directory: studio-ui-remotion-verify
        run: |
          pnpm exec vitest run src/ui/features/montage/stock-downloads.test.tsx src/ui/features/montage/stock-sources.test.tsx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
      - run: pnpm build:web
        working-directory: studio-ui-remotion-verify
      - run: pnpm build:desktop
        working-directory: studio-ui-remotion-verify
      - name: Real source Electron, trusted IPC, Python, persisted timeline and restart
        run: python -B tests/run_isolated.py tests.test_stock_sources_ui -q
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stock-download-queue-windows
          path: .superpowers/stock-sources/electron/
