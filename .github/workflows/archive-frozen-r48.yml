name: Archive verified Frozen r48 (one-shot)
on:
  push:
    branches: [fix/security-pillow-onnx-clip]
    paths: ['.github/workflows/archive-frozen-r48.yml']
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: newsflow-frozen-source-qa
          run-id: 39575622177
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .qa-frozen-r48
      - name: Verify and archive immutable QA binary as DRAFT-only internal release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = '.qa-frozen-r48/NewsFlowCore/NewsFlowCore.exe'
          $expected = '9b4aa652dbbcfe146b534597ad4de89740469d51c97f278c845c21de437f3ffe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Pinned Frozen binary missing' }
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected -or (Get-Item $exe).Length -ne 21498333) {
            throw 'Frozen r48 artifact differs from independently verified exact bytes'
          }
          $receipt = Get-Content -LiteralPath '.qa-frozen-r48/frozen-source-receipt.json' -Raw | ConvertFrom-Json
          if ($receipt.gitSha -ne '4c1938f11ed111929c5eef5e5b8a35637c8fbcd1' -or $receipt.coreExeSha256 -ne $expected) {
            throw 'Build provenance receipt mismatch (verified PR merge commit)'
          }
          $target = Join-Path $env:RUNNER_TEMP 'newsflow-core-2.1.152-r48.zip'
          Compress-Archive -LiteralPath '.qa-frozen-r48/NewsFlowCore', '.qa-frozen-r48/frozen-source-receipt.json' -DestinationPath $target -CompressionLevel Optimal
          $tag = 'internal-core-2.1.152-r48'
          $existing = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Immutable internal core tag already exists: refusing overwrite' }
          & gh release create $tag $target --repo $env:GITHUB_REPOSITORY --target d9383c716cbfaa11d08404707fee64ce5ff9eacc --draft --prerelease --title 'Internal Frozen Core r48 (QA-only)' --notes 'NOT a NewsFlow application release. SHA256: 9b4aa652dbbcfe146b534597ad4de89740469d51c97f278c845c21de437f3ffe; built from d9383c716cbfaa11d08404707fee64ce5ff9eacc; Windows isolated snapshot/FFmpeg smoke PASS.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "INTERNAL_FROZEN_ARCHIVE=PASS tag=$tag sha256=$expected"
