name: Restore migrated LFS fixtures

on:
  push:
    branches:
      - infra/restore-lfs-assets

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: 'pnpm'
          cache-dependency-path: studio-ui-remotion-verify/pnpm-lock.yaml

      - name: Record original LFS OIDs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import json, re

          root = Path("studio-ui-remotion-verify/tests/visual-baselines/approved")
          expected = {}
          for path in sorted(root.glob("*.png")):
              text = path.read_text(encoding="utf-8")
              match = re.search(r"^oid sha256:([0-9a-f]{64})$", text, re.M)
              if not match:
                  raise SystemExit(f"not an LFS pointer: {path}")
              expected[path.as_posix()] = match.group(1)
          if len(expected) != 47:
              raise SystemExit(f"expected 47 visual pointers, found {len(expected)}")

          ffmpeg = Path("assets/ffmpeg.exe").read_text(encoding="utf-8")
          match = re.search(r"^oid sha256:([0-9a-f]{64})$", ffmpeg, re.M)
          if not match:
              raise SystemExit("assets/ffmpeg.exe is not an LFS pointer")
          payload = {"png": expected, "ffmpeg": match.group(1)}
          Path(".lfs-expected.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          print(json.dumps({"visualPointers": len(expected), "ffmpeg": payload["ffmpeg"]}))
          '@ | python -

      - name: Restore exact FFmpeg payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install "imageio-ffmpeg==0.6.0"
          @'
          from pathlib import Path
          import hashlib, json, shutil
          import imageio_ffmpeg

          expected = json.loads(Path(".lfs-expected.json").read_text(encoding="utf-8"))["ffmpeg"]
          source = Path(imageio_ffmpeg.get_ffmpeg_exe())
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          print(f"imageio ffmpeg: {source} sha256={actual} size={source.stat().st_size}")
          if actual != expected:
              raise SystemExit(f"FFmpeg SHA mismatch: expected {expected}, got {actual}")
          shutil.copy2(source, Path("assets/ffmpeg.exe"))
          '@ | python -

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: studio-ui-remotion-verify
        run: pnpm install --frozen-lockfile

      - name: Recreate approved visual baselines in isolated Windows renderer
        shell: pwsh
        working-directory: studio-ui-remotion-verify
        env:
          NEWSFLOW_TEST_MODE: '1'
          NEWSFLOW_UPDATE_VISUAL_BASELINES: '1'
        run: |
          Remove-Item -Force tests/visual-baselines/approved/*.png
          pnpm exec electron scripts/capture-workstation-baselines.mjs

      - name: Verify reconstructed PNGs against original LFS OIDs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import hashlib, json

          expected = json.loads(Path(".lfs-expected.json").read_text(encoding="utf-8"))["png"]
          mismatches = []
          for raw, digest in expected.items():
              path = Path(raw)
              if not path.is_file():
                  mismatches.append((raw, digest, "MISSING"))
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  mismatches.append((raw, digest, actual))
          extras = sorted(
              path.as_posix()
              for path in Path("studio-ui-remotion-verify/tests/visual-baselines/approved").glob("*.png")
              if path.as_posix() not in expected
          )
          print(f"verified={len(expected)-len(mismatches)} mismatches={len(mismatches)} extras={len(extras)}")
          for row in mismatches[:20]:
              print("MISMATCH", *row)
          for row in extras[:20]:
              print("EXTRA", row)
          if mismatches or extras:
              raise SystemExit("Visual baseline reconstruction does not match original LFS OIDs")
          '@ | python -

      - name: Remove broken LFS tracking and commit exact recovered fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          path = Path(".gitattributes")
          lines = path.read_text(encoding="utf-8").splitlines()
          remove_prefixes = (
              "assets/ffmpeg.exe filter=lfs",
              "studio-ui-remotion-verify/tests/visual-baselines/approved/*.png filter=lfs",
          )
          path.write_text(
              "\n".join(line for line in lines if not line.startswith(remove_prefixes)) + "\n",
              encoding="utf-8",
          )
          '@ | python -
          Remove-Item -Force .lfs-expected.json
          Remove-Item -Force .github/workflows/restore-lfs-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes assets/ffmpeg.exe studio-ui-remotion-verify/tests/visual-baselines/approved/*.png .github/workflows/restore-lfs-assets.yml
          git diff --cached --stat
          git commit -m "infra: restore migrated binary test fixtures"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
