name: Sol bounded Montage lock implementation

on:
  push:
    branches: [fix/montage-queue-lock-atomic]
    paths: [.github/workflows/montage-lock-implementation.yml]

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LOCALAPPDATA: /tmp/newsflow-production-sentinel
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/montage-queue-lock-atomic
          fetch-depth: 1
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - run: python -m pip install ruff==0.16.6 pip-audit==2.10.1
      - name: Prove both owner races on unchanged product source
        shell: python
        run: |
          import os, subprocess, sys
          expected = 'f8148a3ab36183a3dc2d7e460c4fe769592a28f3'
          actual = subprocess.check_output(['git', 'hash-object', 'scriptor/bridge.py'], text=True).strip()
          assert actual == expected, (actual, expected)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          result = subprocess.run([sys.executable, 'tests/run_isolated.py', 'tests.test_montage_queue_lock', '-v'], text=True, capture_output=True, timeout=100)
          output = result.stdout + result.stderr
          print(output)
          assert result.returncode == 1, result.returncode
          assert 'FAILED (failures=2)' in output
          assert 'overlapping processes must not both acquire the Montage queue' in output
          assert 'PRODUCTION_WRITE_GUARD=PASS' in output
          print('SOL_SOURCE_RED=PASS_EXPECTED_TWO_OWNER_RACES')
      - name: Apply exact bounded fix and deterministic overlap test
        shell: python
        run: |
          import ast, subprocess
          from pathlib import Path
          source = Path('scriptor/bridge.py')
          assert subprocess.check_output(['git', 'hash-object', str(source)], text=True).strip() == 'f8148a3ab36183a3dc2d7e460c4fe769592a28f3'
          text = source.read_text(encoding='utf-8')
          for name, body_index in [('_claim_montage_queue_lock', 2), ('_release_montage_queue_lock', 1)]:
              node = next(node for node in ast.parse(text).body if isinstance(node, ast.FunctionDef) and node.name == name)
              lines = text.splitlines(keepends=True)
              start, end = node.body[body_index].lineno - 1, node.end_lineno
              body = lines[start:end]
              guard = '    with _exclusive_settings_write(lock_path.with_name("montage-queue-owner.json")):\n'
              comment = ''
              if name == '_claim_montage_queue_lock':
                  comment = '    # Keep this stable mutex separate from the replaceable PID record. The\n    # whole read/reclaim/publish transaction must exclude other claimants.\n'
              lines[start:end] = [comment + guard] + ['    ' + line if line.strip() else line for line in body]
              text = ''.join(lines)
          ast.parse(text)
          source.write_text(text, encoding='utf-8')
          test = Path('tests/test_montage_queue.py')
          assert subprocess.check_output(['git', 'hash-object', str(test)], text=True).strip() == '32e4cf770fdf38ae9edfae6b0254167719c57e19'
          text = test.read_text(encoding='utf-8')
          target = next(node for node in ast.walk(ast.parse(text)) if isinstance(node, ast.FunctionDef) and node.name == 'test_overlapping_queue_starts_have_one_owner_and_one_render')
          replacement = '''    def test_overlapping_queue_starts_have_one_owner_and_one_render(self):
                  """Keep the owner before status persistence until the contender returns."""
                  with tempfile.TemporaryDirectory() as folder:
                      root = Path(folder)
                      settings, jobs = self._queue_settings(root, ["Only row"])
                      patches, plan_calls, render_calls = self._queue_runtime_patches(
                          root, settings, ["Only row"], jobs,
                      )
                      owner_entered = threading.Event()
                      release_owner = threading.Event()

                      def overlapping_session():
                          owner_entered.set()
                          if not release_owner.wait(10):
                              raise RuntimeError("queue owner was not released by the test")
                          return ["Only row"], jobs

                      results = []
                      errors = []

                      def launch():
                          try:
                              results.append(bridge.run_montage_queue({"indices": [0]}))
                          except Exception as exc:
                              errors.append(str(exc))

                      threads = [threading.Thread(target=launch) for _ in range(2)]
                      for context in patches:
                          context.start()
                      try:
                          with patch.object(bridge, "load_session", side_effect=overlapping_session):
                              try:
                                  threads[0].start()
                                  self.assertTrue(owner_entered.wait(5), "queue owner did not enter load_session")
                                  threads[1].start()
                                  threads[1].join(5)
                                  self.assertFalse(threads[1].is_alive(), "overlapping start was not rejected")
                              finally:
                                  release_owner.set()
                                  for thread in threads:
                                      if thread.ident is not None:
                                          thread.join(5)
                              for thread in threads:
                                  self.assertFalse(thread.is_alive(), "queue thread did not finish")
                      finally:
                          for context in reversed(patches):
                              context.stop()

                  self.assertEqual(errors, [])
                  self.assertEqual(plan_calls, [0])
                  self.assertEqual(render_calls, ["Only row"])
                  self.assertEqual(sorted(result["operationResult"]["count"] for result in results), [0, 1])
          '''
          lines = text.splitlines(keepends=True)
          lines[target.lineno - 1:target.end_lineno] = [replacement]
          text = ''.join(lines)
          ast.parse(text)
          test.write_text(text, encoding='utf-8')
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == {'scriptor/bridge.py', 'tests/test_montage_queue.py'}, changed
          subprocess.run(['git', 'diff', '--check'], check=True)
      - name: Source Montage regression GREEN
        run: python tests/run_isolated.py tests.test_montage_queue_lock tests.test_montage_queue tests.test_build_montage_runtime_guard tests.test_runtime_action_map -v
      - name: Repeat contention and overlap contracts ten times
        shell: python
        run: |
          import subprocess, sys
          cases = ['tests.test_montage_queue_lock', 'tests.test_montage_queue.MontageQueueStateTests.test_overlapping_queue_starts_have_one_owner_and_one_render'] * 10
          subprocess.run([sys.executable, 'tests/run_isolated.py', *cases, '-v'], check=True, timeout=150)
          print('SOL_CONTENTION_STRESS=PASS cycles=10 tests=40')
      - name: Static and integrity checks
        run: |
          python -m ruff check tests/test_montage_queue_lock.py
          python -m ruff check --select E9,F63,F7,F82 scriptor/bridge.py tests/test_montage_queue.py
          python scripts/secret-scan.py
          git diff --check
      - name: Commit only the prepared product fix to the task branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/montage-queue-lock-atomic'
          git config user.name 'NewsFlow Engineering'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scriptor/bridge.py tests/test_montage_queue.py
          git commit -m 'fix(montage): serialize owner claim and release transactions'
          git push origin HEAD:refs/heads/fix/montage-queue-lock-atomic
          echo "SOL_IMPLEMENTATION_HEAD=$(git rev-parse HEAD)"
          git status --short
