name: Overlay integration conflict probe (temporary)
on:
  push:
    branches: [integrate/commercial-montage-2026-10-21]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Discover exact overlay conflicts without changing main
        shell: bash
        run: |
          git fetch origin codex/montage-overlays --no-tags
          git config user.name 'NewsFlow QA Probe'
          git config user.email 'qa-probe@users.noreply.github.com'
          if git merge --no-commit --no-ff origin/codex/montage-overlays; then
            echo 'OVERLAYS_MERGE_UNMODIFIED=PASS'
            git diff --stat --cached
            exit 0
          fi
          echo 'OVERLAYS_MERGE_UNMODIFIED=FAIL'
          git diff --name-only --diff-filter=U
          for file in $(git diff --name-only --diff-filter=U); do
            echo "::group::CONFLICT $file"
            grep -n -E '^<<<<<<< |^=======|^>>>>>>> ' "$file" | head -n 80 || true
            echo "::endgroup::"
          done
          exit 1
