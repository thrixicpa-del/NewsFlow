name: Overlay merge probe (no tests)
on:
  push:
    branches: [qa/overlay-merge-probe-20261021]
permissions:
  contents: write
jobs:
  merge-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge overlays with Git's real 3-way algorithm
        shell: bash
        run: |
          set -uo pipefail
          git config user.name 'newsflow-integration[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main codex/montage-overlays --no-tags
          set +e
          git merge --no-commit --no-ff origin/codex/montage-overlays
          exitcode=$?
          set -e
          if [ "$exitcode" -ne 0 ]; then
            echo MERGE_PROBE=CONFLICT_REPAIR
            git diff --name-only --diff-filter=U | tee merge-conflicts.txt
            python3 scripts/qa_resolve_overlay_merge.py $(cat merge-conflicts.txt)
            git add $(cat merge-conflicts.txt)
            git diff --cached --check
          fi
          python3 -m compileall -q scriptor
          if git diff --name-only --diff-filter=U | grep .; then
            echo UNRESOLVED_CONFLICTS
            exit 3
          fi
          # Workflow writes require a separate permission; leave the existing
          # CI files unchanged here and apply their explicit additions later.
          git restore --source=HEAD --staged --worktree -- .github/workflows/ci.yml .github/workflows/windows-native.yml
          git diff --cached --check
          git commit -m 'qa: resolve overlays without changing CI workflows'
          # Squash the merge into one normal branch commit; do not re-push
          # overlay branch history which already contains workflow edits.
          git reset --soft HEAD^1
          git commit -m 'qa: integrate overlay source and tests (no workflow changes)'
          git push origin HEAD:qa/overlay-merge-probe-20261021
          echo MERGE_PROBE=PASS
          git rev-parse HEAD
