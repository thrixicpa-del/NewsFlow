name: Security lock refresh (temporary)
on:
  push:
    branches: [fix/security-pillow-onnx-clip]
permissions:
  contents: write
concurrency:
  group: security-lock-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'thrixicpa-del/NewsFlow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve hashed dependency locks
        run: |
          python -m pip install 'pip-tools>=7.4,<8'
          pip-compile --generate-hashes --strip-extras --upgrade-package pillow --output-file requirements.lock requirements.txt
          pip-compile --generate-hashes --strip-extras --upgrade-package pillow --output-file requirements-test.lock requirements-test.in
          git diff --check
      - name: Commit only generated locks to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.lock requirements-test.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build(deps): regenerate Pillow 13 hash-locked dependencies'
            git push origin HEAD:fix/security-pillow-onnx-clip
          fi
