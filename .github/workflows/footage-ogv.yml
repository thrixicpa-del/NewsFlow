name: Wikimedia OGV regression
on:
  pull_request:
    paths:
      - 'scriptor/cutter.py'
      - 'scriptor/footage.py'
      - 'tests/test_cutter.py'
      - 'tests/test_footage.py'
      - '.github/workflows/footage-ogv.yml'
permissions:
  contents: read
jobs:
  scoped-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      LOCALAPPDATA: ${{ github.workspace }}/.ci-ogv-production-boundary
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: requirements-test.lock }
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Isolated OGV admission, cutter and footage regressions
        run: python -B tests/run_isolated.py tests.test_cutter tests.test_footage -q
      - run: git diff --check HEAD^ HEAD
