name: Windows native
on:
  pull_request:
    branches: [main]
jobs:
  source-electron:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with: { lfs: true }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - uses: pnpm/action-setup@v4
        with: { version: '11.19.0' }
      - uses: actions/setup-node@v6
        with: { node-version: '24.19.0', cache: 'pnpm', cache-dependency-path: studio-ui-remotion-verify/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: studio-ui-remotion-verify
      - run: pnpm build:web
        working-directory: studio-ui-remotion-verify
      - run: pnpm build:desktop
        working-directory: studio-ui-remotion-verify
      - name: Install pinned Electron source test runtime
        run: node node_modules/electron/install.js
        working-directory: studio-ui-remotion-verify
      - name: Require genuine source runtime and checked-out media tool
        shell: pwsh
        run: |
          if (!(Test-Path studio-ui-remotion-verify/node_modules/electron/dist/electron.exe)) { throw 'Electron runtime missing' }
          python -c "from pathlib import Path; p = Path('assets/ffmpeg.exe'); assert p.read_bytes()[:2] == b'MZ', 'Genuine LFS FFmpeg required'"
          if ($LASTEXITCODE -ne 0) { throw 'LFS FFmpeg missing' }
      - name: Isolated actual overlay UI, queue, MP4 and process restart
        run: python tests/run_isolated.py tests.test_overlay_source_ui
