name: Windows native
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    branches: [main]
jobs:
  source-electron:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with: { lfs: true }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Voice queue ownership and independent template save
        run: python -B tests/run_isolated.py tests.test_voice_queue_owner tests.test_voicer.VoicerTests.test_template_save_survives_an_independent_running_voice_job -q
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-voice-owner-boundary
      - uses: pnpm/action-setup@v4
        with: { version: '11.19.0' }
      - uses: actions/setup-node@v6
        with: { node-version: '24.19.0', cache: 'pnpm', cache-dependency-path: studio-ui-remotion-verify/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: studio-ui-remotion-verify
      - name: Install pinned Electron runtime for source UI acceptance
        run: node node_modules/electron/install.js
        working-directory: studio-ui-remotion-verify
      - run: pnpm build:web
        working-directory: studio-ui-remotion-verify
      - run: pnpm build:desktop
        working-directory: studio-ui-remotion-verify
      - name: Isolated production reset and real Electron restart
        shell: pwsh
        run: |
          if (!(Test-Path 'studio-ui-remotion-verify/node_modules/electron/dist/electron.exe')) {
            throw 'Real Electron runtime required; UI acceptance must not skip'
          }
          python tests/run_isolated.py tests.test_production_reset tests.test_production_topic_reset_ui -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary
      - name: Standalone cover topics and real UI restart
        shell: pwsh
        run: |
          if (!(Test-Path 'studio-ui-remotion-verify/node_modules/electron/dist/electron.exe')) {
            throw 'Real Electron runtime required; UI acceptance must not skip'
          }
          python tests/run_isolated.py tests.test_cover_standalone_topics tests.test_cover_standalone_ui -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary

      - name: Cover prompt blocks and real UI restart
        shell: pwsh
        run: |
          if (!(Test-Path 'studio-ui-remotion-verify/node_modules/electron/dist/electron.exe')) {
            throw 'Real Electron runtime required; UI acceptance must not skip'
          }
          python tests/run_isolated.py tests.test_cover_prompt_blocks tests.test_cover_prompt_blocks_ui -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary


      - name: Browser documents real Electron acceptance
        run: python -B tests/run_isolated.py tests.test_browser_documents_ui -q
        env:
          NEWSFLOW_RUN_ELECTRON_E2E: '1'
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary
      - name: Ensure FFprobe for independent media inspection
        shell: pwsh
        run: |
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Real Electron overlay UI with disposable media
        run: python -B tests/run_isolated.py tests.test_overlay_source_ui -q
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-overlay-boundary
      - name: Isolated stock UI and real synthetic media renders
        run: python -B tests/run_isolated.py tests.test_stock_sources_ui tests.test_stock_render tests.test_footage_blocks_ui_isolated tests.test_local_video_zoom tests.test_local_video_zoom_media -q
        env:
          NEWSFLOW_RUN_ELECTRON_E2E: '1'
          NEWSFLOW_RUN_FOOTAGE_BLOCKS_UI: '1'
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-stock-boundary
      - name: Build source Remotion composition
        run: pnpm build:remotion
        working-directory: studio-ui-remotion-verify
      - name: Local zoom real Remotion on/off media comparison
        shell: pwsh
        run: |
          $env:NEWSFLOW_REMOTION_NODE = (Get-Command node).Source
          $env:NEWSFLOW_REMOTION_RUNNER = (Resolve-Path 'studio-ui-remotion-verify/remotion/render.mjs').Path
          python -B tests/run_isolated.py tests.test_local_video_zoom_media -q
        env:
          NEWSFLOW_LOCAL_ZOOM_RENDERER: remotion
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-local-zoom-remotion-boundary
