name: Windows native
on:
  pull_request:
    branches: [main, codex/montage-stock-sources]
jobs:
  source-electron:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with: { lfs: true }
      - uses: pnpm/action-setup@v4
        with: { version: '11.19.0' }
      - uses: actions/setup-node@v6
        with: { node-version: '24.19.0', cache: 'pnpm', cache-dependency-path: studio-ui-remotion-verify/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: studio-ui-remotion-verify
      # pnpm intentionally blocks Electron's install lifecycle by default.
      # Source UI E2E needs its pinned runtime; no application packaging occurs.
      - name: Install pinned Electron runtime for source UI tests
        run: node node_modules/electron/install.js
        working-directory: studio-ui-remotion-verify
      - run: pnpm build:web
        working-directory: studio-ui-remotion-verify
      - run: pnpm build:desktop
        working-directory: studio-ui-remotion-verify
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Ensure FFprobe for independent media inspection
        shell: pwsh
        run: |
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Isolated stock UI and real synthetic media renders
        run: python -B tests/run_isolated.py tests.test_stock_sources_ui tests.test_stock_render tests.test_footage_blocks_ui_isolated -q
        env:
          NEWSFLOW_RUN_ELECTRON_E2E: '1'
          NEWSFLOW_RUN_FOOTAGE_BLOCKS_UI: '1'
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-stock-boundary
