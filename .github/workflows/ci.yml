name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: pnpm/action-setup@v4
        with: { version: '11.19.0' }
      - uses: actions/setup-node@v6
        with: { node-version: '24.19.0', cache: 'pnpm', cache-dependency-path: studio-ui-remotion-verify/pnpm-lock.yaml }
      - run: python -m pip install ruff==0.16.6 pip-audit==2.10.1
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: pnpm install --frozen-lockfile
        working-directory: studio-ui-remotion-verify
      - run: pwsh -NoProfile -File scripts/release-lint.ps1
      - run: pwsh -NoProfile -File scripts/audit-python-dependencies.ps1
      - run: python tests/run_isolated.py tests.test_onnx_clip_adapter
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-clip-adapter
      - run: python tests/run_isolated.py tests.test_runtime_action_map tests.test_electron_security tests.test_secret_scan
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary
      - run: python tests/run_isolated.py tests.test_cover_prompt_blocks tests.test_cover_standalone_topics tests.test_cover_prompt_pairs_import tests.test_cover_manual_prompt_readiness tests.test_cover_manual_no_paid_aux tests.test_cover_result_identity tests.test_cover_queue_tombstones tests.test_covers
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary
      - run: python tests/run_isolated.py tests.test_publication_v2 tests.test_youtube_publisher tests.test_youtube_engagement tests.test_youtube_studio
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python tests/run_isolated.py tests.test_ai_index tests.test_montage_queue tests.test_montage_index_integrity
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-montage-proxy
      - run: >-
          python tests/run_isolated.py
          scriptor.test_montage_render.MontageRenderTests.test_source_proxy_cache_reuses_an_unchanged_source_without_touching_it
          scriptor.test_montage_render.MontageRenderTests.test_source_proxy_warmup_rebuilds_an_incomplete_cached_file
          scriptor.test_montage_render.MontageRenderTests.test_source_proxy_warmup_writes_a_silent_1080p_30fps_video
          scriptor.test_montage_render.MontageRenderTests.test_legacy_renderer_prefers_a_current_prepared_source_proxy
          scriptor.test_montage_render.MontageRenderTests.test_gpu_capability_requires_a_working_nvenc_device_and_caches_the_probe
          scriptor.test_montage_render.MontageRenderTests.test_gpu_chunk_command_preserves_order_and_source_trims
          scriptor.test_montage_render.MontageRenderTests.test_gpu_renderer_uses_bounded_chunks_and_never_proxy_cache
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-montage-render
      - run: python tests/run_isolated.py tests.test_voicer tests.test_tts_ranges tests.test_voice_map
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-voice
      - run: python tests/run_isolated.py tests.test_story_planner tests.test_runner tests.test_scenarios tests.test_session tests.test_production_reset tests.test_ideas
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-scenario-story-planner
      - run: python -m playwright install --with-deps chromium
      - run: >-
          python tests/run_isolated.py tests.test_browser_topic_scenarios
          tests.test_chatgpt_browser tests.test_chatgpt_document_readiness
          tests.test_chatgpt_documents_settings tests.test_browser_documents_pipeline
          scriptor.test_command_contract
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-browser-topics
      - run: pnpm typecheck
        working-directory: studio-ui-remotion-verify
      - run: pnpm test:ui
        working-directory: studio-ui-remotion-verify
      - run: pnpm verify:security
        working-directory: studio-ui-remotion-verify
      - run: pnpm build
        working-directory: studio-ui-remotion-verify
      - run: python tests/run_isolated.py tests.test_core_runtime_guard
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-core-guard
