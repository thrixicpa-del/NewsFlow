name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: pnpm/action-setup@v4
        with: { version: '11.19.0' }
      - uses: actions/setup-node@v6
        with: { node-version: '24.19.0', cache: 'pnpm', cache-dependency-path: studio-ui-remotion-verify/pnpm-lock.yaml }
      - run: python -m pip install ruff
      - run: pnpm install --frozen-lockfile
        working-directory: studio-ui-remotion-verify
      - run: ruff check scripts tests
      - run: python tests/run_isolated.py tests.test_runtime_action_map tests.test_electron_security tests.test_secret_scan
      - run: pnpm typecheck
        working-directory: studio-ui-remotion-verify
      - run: pnpm test:ui
        working-directory: studio-ui-remotion-verify
      - run: pnpm verify:security
        working-directory: studio-ui-remotion-verify
      - run: pnpm build
        working-directory: studio-ui-remotion-verify
