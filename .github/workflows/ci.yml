name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: pnpm/action-setup@v4
        with: { version: '11.19.0' }
      - uses: actions/setup-node@v6
        with: { node-version: '24.19.0', cache: 'pnpm', cache-dependency-path: studio-ui-remotion-verify/pnpm-lock.yaml }
      - run: python -m pip install ruff==0.16.6 pip-audit==2.10.1
      - run: pnpm install --frozen-lockfile
        working-directory: studio-ui-remotion-verify
      - run: pwsh -NoProfile -File scripts/release-lint.ps1
      - run: pwsh -NoProfile -File scripts/audit-python-dependencies.ps1
      - run: python tests/run_isolated.py tests.test_runtime_action_map tests.test_electron_security tests.test_secret_scan
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary
      - run: python tests/run_isolated.py tests.test_covers.CoverLocalCompositorTests.test_repeat_current_uses_saved_render_profile_instead_of_new_defaults tests.test_covers.CoverLocalCompositorTests.test_repeat_current_contract_reuses_saved_prompt_profile_and_reference_without_reselection tests.test_covers.CoverLocalCompositorTests.test_repeat_current_rejects_legacy_row_before_deleting_existing_image tests.test_covers.CoverLocalCompositorTests.test_repeat_current_rejects_missing_render_profile_before_deleting_existing_image tests.test_covers.CoverRenderQueueSafetyTests.test_manual_retry_preserves_current_prompt_text_face_and_render_profile tests.test_covers.CoverLocalCompositorTests.test_arbitrary_cover_request_uses_current_scene_without_a_legacy_render_tail -v
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary
      - run: python -m ruff check scriptor/bridge.py tests/test_covers.py --select E9,F63,F7,F82
      - run: git diff --check origin/main...HEAD
      - run: pnpm exec vitest run src/ui/features/covers/covers-view.test.tsx
        working-directory: studio-ui-remotion-verify
      - run: python tests/run_isolated.py tests.test_publication_v2 tests.test_youtube_publisher tests.test_youtube_engagement tests.test_youtube_studio
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary
      - run: pnpm typecheck
        working-directory: studio-ui-remotion-verify
      - run: pnpm test:ui
        working-directory: studio-ui-remotion-verify
      - run: pnpm verify:security
        working-directory: studio-ui-remotion-verify
      - run: pnpm build
        working-directory: studio-ui-remotion-verify
