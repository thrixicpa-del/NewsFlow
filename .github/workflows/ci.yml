name: CI
# issue-231-fast-review
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: pnpm/action-setup@v4
        with: { version: '11.19.0' }
      - uses: actions/setup-node@v6
        with: { node-version: '24.19.0', cache: 'pnpm', cache-dependency-path: studio-ui-remotion-verify/pnpm-lock.yaml }
      - run: python -m pip install ruff==0.16.6 pip-audit==2.10.1
      - run: pnpm install --frozen-lockfile
        working-directory: studio-ui-remotion-verify
      - run: pwsh -NoProfile -File scripts/release-lint.ps1
      - run: pwsh -NoProfile -File scripts/audit-python-dependencies.ps1
      - run: python tests/run_isolated.py tests.test_runtime_action_map tests.test_electron_security tests.test_secret_scan
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary
      - run: python tests/run_isolated.py tests.test_covers.CoverGalleryFileStateTests.test_topic_fallbacks_do_not_turn_generic_market_words_into_oil_traders tests.test_covers.CoverGalleryFileStateTests.test_final_prompt_rejects_known_oil_market_collision_for_non_energy_topic tests.test_covers.CoverGalleryFileStateTests.test_final_prompt_preserves_structured_scene_fields_over_generic_script_fallback tests.test_covers.CoverGalleryFileStateTests.test_fastgen_payload_keeps_multiline_scene_slots_from_the_saved_prompt tests.test_covers.CoverFaceLibraryTests.test_my_faces_route_uses_prepared_auto_png_and_fastgen_only_route_sends_no_user_face -v
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary
      - run: python -m ruff check scriptor/bridge.py scriptor/thumbnail_prompt_v2.py tests/test_covers.py --select E9,F63,F7,F82
      - run: git diff --check origin/main...HEAD
      - run: python tests/run_isolated.py tests.test_publication_v2 tests.test_youtube_publisher tests.test_youtube_engagement tests.test_youtube_studio
        env:
          LOCALAPPDATA: ${{ runner.temp }}/newsflow-production-boundary
      - run: pnpm exec vitest run src/ui/features/covers/covers-view.test.tsx
        working-directory: studio-ui-remotion-verify
      - run: pnpm typecheck
        working-directory: studio-ui-remotion-verify
      - run: pnpm test:ui
        working-directory: studio-ui-remotion-verify
      - run: pnpm verify:security
        working-directory: studio-ui-remotion-verify
      - run: pnpm build
        working-directory: studio-ui-remotion-verify
