[pytest]
testpaths = tests scriptor
python_files = test_*.py
addopts = -ra
markers =
    unit: deterministic in-process behavior with no external process or provider.
    integration: disposable multi-module runtime chain with providers mocked.
    contract: renderer, IPC, bridge, command schema, or frozen-core compatibility boundary.
    slow: deliberately longer local validation; excluded from fast feedback by choice.
    provider_real: opt-in test that may use a real external provider or credits.
    packaged: requires a frozen core or packaged desktop artifact.
